# Builds the site and uploads it to SiteGround on every push to main.
#
# Add these repository secrets in GitHub → Settings → Secrets and variables → Actions:
#   SITEGROUND_HOST      e.g. giowg1234.siteground.biz
#   SITEGROUND_USER      the SFTP user from SiteGround → Site Tools → Devs → SFTP
#   SITEGROUND_KEY       the private key for that SFTP user (whole file contents)
#   SITEGROUND_PATH      e.g. /home/customer/www/sociallab.com.au/public_html/

name: Deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build site
        run: python3 build.py

      - name: Upload to SiteGround
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='storage/' --exclude='api/config.local.php'
          path: dist/
          remote_path: ${{ secrets.SITEGROUND_PATH }}
          remote_host: ${{ secrets.SITEGROUND_HOST }}
          remote_user: ${{ secrets.SITEGROUND_USER }}
          remote_key: ${{ secrets.SITEGROUND_KEY }}
