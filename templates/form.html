<div class="form-panel" id="form-{{id}}">
  <form class="enquiry-form" method="post" action="/api/enquiry.php" novalidate data-source="{{source}}">
    <input type="hidden" name="source" value="{{source}}">
    <input type="hidden" name="elapsed" value="0" data-elapsed>
    <input type="hidden" name="page" value="" data-page>
    <div class="form-hp" aria-hidden="true">
      <label for="{{id}}-company">Company (leave blank)</label>
      <input type="text" id="{{id}}-company" name="company" tabindex="-1" autocomplete="off">
    </div>

    <div class="form-grid">
      <div class="field">
        <label for="{{id}}-name">Name <span class="req">*</span></label>
        <input type="text" id="{{id}}-name" name="name" autocomplete="name" required>
        <span class="field__error">Please tell us your name.</span>
      </div>

      <div class="field">
        <label for="{{id}}-email">Email <span class="req">*</span></label>
        <input type="email" id="{{id}}-email" name="email" autocomplete="email" required>
        <span class="field__error">Please enter a valid email address.</span>
      </div>

      <div class="field">
        <label for="{{id}}-phone">Phone <span class="req">*</span></label>
        <input type="tel" id="{{id}}-phone" name="phone" autocomplete="tel" required>
        <span class="field__error">Please enter a contact number.</span>
      </div>

      <div class="field">
        <label for="{{id}}-business">Business type</label>
        <select id="{{id}}-business" name="business_type">
          <option value="">Select…</option>
          <option>Real estate agent</option>
          <option>Real estate agency / principal</option>
          <option>Buyers agent</option>
          <option>Construction / builder / developer</option>
          <option>Property adjacent business</option>
          <option>Other</option>
        </select>
      </div>

      <div class="field">
        <label for="{{id}}-business-name">Agency / business name</label>
        <input type="text" id="{{id}}-business-name" name="business_name" autocomplete="organization">
      </div>

      <div class="field">
        <label for="{{id}}-area">Core suburb / area</label>
        <input type="text" id="{{id}}-area" name="area" placeholder="e.g. Palm Beach, Gold Coast">
      </div>

{{extra_fields}}

      <div class="field field--full">
        <label for="{{id}}-interest">{{interest_label}}</label>
        <select id="{{id}}-interest" name="interest">
          <option value="">Select…</option>
{{interest_options}}
        </select>
      </div>

      <div class="field field--full">
        <label for="{{id}}-message">Tell us a bit more</label>
        <textarea id="{{id}}-message" name="message" placeholder="Where you are at now, what you are trying to achieve, and anything we should know."></textarea>
      </div>
    </div>

    <div class="form-foot">
      <p class="form-note">{{note}}</p>
      <button class="btn btn--rust btn--lg" type="submit">{{submit}}{{arrow}}</button>
    </div>

    <div class="form-status" role="alert"></div>
  </form>

  <div class="form-success">
    <div class="tick">✓</div>
    <h3 class="h3">{{success}}</h3>
    <p class="lede" style="margin: 12px auto 0;">{{success_body}}</p>
  </div>
</div>
